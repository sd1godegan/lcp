<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<meta name="description" content="Cerdas Cermat PAI - Babak Penyisihan Internal">
<title>Cerdas Cermat PAI · SD Negeri 1 Godegan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

<style>
/* ============ RESET & TOKENS ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --primary:#667eea;
  --primary-2:#764ba2;
  --grad:linear-gradient(135deg,#667eea,#764ba2);
  --bg:#f8f9ff;
  --text:#1f2937;
  --muted:#6b7280;
  --radius:14px;
  --shadow-lg:0 20px 60px rgba(0,0,0,.25);
  --t:.2s cubic-bezier(.4,0,.2,1);
}

html{height:100%;scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--grad);
  min-height:100vh;
  min-height:100dvh;
  display:grid;place-items:center;
  padding:clamp(12px,3vw,24px);
  -webkit-font-smoothing:antialiased;
  color:var(--text);
}

/* ============ APP SHELL ============ */
.app{
  width:100%;max-width:720px;
  background:#fff;border-radius:20px;
  box-shadow:var(--shadow-lg);
  padding:clamp(20px,4vw,32px);
  position:relative;overflow:hidden;
}

/* ============ SCREENS ============ */
.screen{display:none;animation:fadeUp .35s cubic-bezier(.4,0,.2,1)}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ============ WELCOME ============ */
.brand{text-align:center;margin-bottom:clamp(20px,4vw,32px)}
.brand-title{
  font-size:clamp(22px,5vw,32px);font-weight:800;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  color:transparent;letter-spacing:-.5px;margin-bottom:6px;
}
.brand-sub{font-size:clamp(12px,2.5vw,14px);color:var(--muted);font-weight:500}
.brand-badge{
  display:inline-block;margin-top:10px;padding:4px 12px;
  background:#f0f2ff;color:var(--primary);border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.5px;
}

.section-label{
  font-size:14px;font-weight:600;color:var(--muted);
  text-align:center;margin-bottom:16px;
}

.peserta-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(8px,2vw,12px);margin-bottom:24px;
}

.peserta-card{
  background:#fff;border:2px solid #e5e7eb;border-radius:var(--radius);
  padding:clamp(16px,3vw,24px) clamp(8px,2vw,16px);
  cursor:pointer;transition:all var(--t);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  font-family:inherit;color:inherit;
  position:relative;overflow:hidden;
}
.peserta-card:hover{
  border-color:transparent;transform:translateY(-4px);
  box-shadow:0 15px 30px rgba(102,126,234,.25);
}
.peserta-card:active{transform:translateY(-2px) scale(.98)}
.peserta-card:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

.avatar{
  width:clamp(50px,12vw,64px);height:clamp(50px,12vw,64px);
  border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:clamp(20px,5vw,26px);
  box-shadow:0 8px 20px rgba(0,0,0,.15);transition:transform var(--t);
}
.peserta-card:hover .avatar{transform:scale(1.08) rotate(-4deg)}
.peserta-name{font-weight:700;font-size:clamp(14px,3vw,16px)}

.footer-info{
  display:flex;justify-content:center;gap:clamp(10px,3vw,20px);
  padding:16px;background:var(--bg);border-radius:var(--radius);
  font-size:clamp(11px,2.5vw,13px);color:var(--muted);flex-wrap:wrap;
}
.footer-info span{display:flex;align-items:center;gap:5px}
.footer-info strong{color:var(--primary);font-weight:700}

/* ============ QUIZ ============ */
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
.quiz-progress-label{font-weight:700;color:var(--primary);font-size:clamp(13px,3vw,15px)}
.timer{
  font-weight:700;font-size:clamp(16px,4vw,20px);color:#ef4444;
  background:#fee2e2;padding:6px 14px;border-radius:999px;
  font-variant-numeric:tabular-nums;transition:all var(--t);
}
.timer.warning{animation:pulse 1s infinite;background:#dc2626;color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.progress-track{
  width:100%;height:8px;background:#e5e7eb;border-radius:4px;
  overflow:hidden;margin-bottom:24px;
}
.progress-fill{
  height:100%;background:var(--grad);border-radius:4px;width:0;
  transition:width .35s cubic-bezier(.4,0,.2,1);
}

.question-card{
  background:var(--bg);padding:clamp(18px,3vw,24px);
  border-radius:var(--radius);margin-bottom:20px;min-height:100px;
  display:flex;align-items:center;border-left:4px solid var(--primary);
}
.question-text{font-size:clamp(15px,3.2vw,17px);line-height:1.55;font-weight:500}

.options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.option{
  display:flex;align-items:center;gap:12px;
  padding:clamp(12px,2.5vw,16px) clamp(14px,3vw,20px);
  border:2px solid #e5e7eb;border-radius:12px;cursor:pointer;
  transition:all var(--t);user-select:none;background:#fff;
}
.option:hover{border-color:var(--primary);background:#f8f9ff;transform:translateX(4px)}
.option.selected{border-color:var(--primary);background:#eef1ff;box-shadow:0 4px 12px rgba(102,126,234,.15)}
.option.selected .option-letter{background:var(--grad);transform:scale(1.05)}
.option:active{transform:translateX(4px) scale(.99)}

.option-letter{
  width:clamp(28px,6vw,34px);height:clamp(28px,6vw,34px);
  border-radius:50%;background:#cbd5e1;color:#fff;
  display:grid;place-items:center;font-weight:800;
  font-size:clamp(13px,3vw,15px);flex-shrink:0;transition:all var(--t);
}
.option-text{flex:1;font-size:clamp(14px,3vw,16px);line-height:1.4}

.nav-buttons{display:flex;gap:10px}
.nav-buttons .btn{flex:1}

/* ============ BUTTONS ============ */
.btn{
  padding:clamp(12px,2.5vw,14px) clamp(20px,4vw,25px);
  border:none;border-radius:12px;font-family:inherit;
  font-size:clamp(14px,3vw,16px);font-weight:700;
  cursor:pointer;transition:all var(--t);will-change:transform;
}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(102,126,234,.3)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 24px rgba(102,126,234,.4)}
.btn-secondary{background:#f1f5f9;color:var(--text)}
.btn-secondary:hover:not(:disabled){background:#e2e8f0}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* ============ RESULT ============ */
.result-head{text-align:center;margin-bottom:20px}
.result-title{font-size:clamp(22px,5vw,28px);font-weight:800;margin-bottom:6px}
.result-peserta{color:var(--muted);font-size:clamp(13px,3vw,15px)}

.score-circle{
  width:clamp(140px,35vw,180px);height:clamp(140px,35vw,180px);
  border-radius:50%;background:var(--grad);margin:20px auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;box-shadow:0 15px 40px rgba(102,126,234,.4);
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

.score-number{font-size:clamp(48px,12vw,64px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score-label{font-size:clamp(11px,2.5vw,13px);opacity:.9;margin-top:4px;letter-spacing:.5px}

.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stat{text-align:center;padding:14px 8px;background:var(--bg);border-radius:12px}
.stat-value{font-size:clamp(18px,4vw,22px);font-weight:800;display:block;margin-bottom:2px}
.stat-label{font-size:clamp(10px,2.3vw,12px);color:var(--muted);font-weight:600;letter-spacing:.3px}
.stat.ok .stat-value{color:#16a34a}
.stat.no .stat-value{color:#dc2626}
.stat.time .stat-value{color:var(--primary);font-size:clamp(14px,3vw,16px)}

.sync-status{
  text-align:center;font-size:12px;color:var(--muted);
  margin-top:-10px;margin-bottom:20px;font-style:italic;
}

/* ============ OVERLAY ============ */
.overlay{
  position:fixed;inset:0;background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity var(--t);
}
.overlay.active{opacity:1;pointer-events:auto}
.spinner{
  width:40px;height:40px;border:4px solid #e5e7eb;
  border-top-color:var(--primary);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ HINT ============ */
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:14px}
.hint kbd{
  background:#f1f5f9;border:1px solid #e2e8f0;border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;font-family:ui-monospace,monospace;
  font-size:10px;font-weight:600;
}

/* ============ MOBILE ============ */
@media (max-width:480px){
  .peserta-grid{gap:8px}
}

/* ============ A11Y ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="app">

  <!-- ========== WELCOME ========== -->
  <section id="scr-welcome" class="screen active">
    <div class="brand">
      <h1 class="brand-title">🏆 Cerdas Cermat PAI</h1>
      <p class="brand-sub">Babak Penyisihan · SD Negeri 1 Godegan</p>
      <span class="brand-badge">INTERNAL</span>
    </div>

    <p class="section-label">Pilih namamu untuk memulai 👇</p>

    <div class="peserta-grid" id="pesertaGrid"></div>

    <div class="footer-info">
      <span>📝 <strong>25</strong> soal</span>
      <span>⏱️ <strong>20</strong> menit</span>
      <span>🎯 <strong>100</strong> poin</span>
    </div>
  </section>

  <!-- ========== QUIZ ========== -->
  <section id="scr-quiz" class="screen">
    <div class="quiz-header">
      <div class="quiz-progress-label" id="quizLabel">Soal 1 / 25</div>
      <div class="timer" id="timer">20:00</div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-card">
      <p class="question-text" id="questionText"></p>
    </div>

    <div class="options" id="options"></div>

    <div class="nav-buttons">
      <button class="btn btn-secondary" id="btnPrev" type="button">← Sebelumnya</button>
      <button class="btn btn-primary" id="btnNext" type="button">Selanjutnya →</button>
    </div>

    <p class="hint">
      💡 <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> untuk jawab · <kbd>←</kbd> <kbd>→</kbd> navigasi
    </p>
  </section>

  <!-- ========== RESULT ========== -->
  <section id="scr-result" class="screen">
    <div class="result-head">
      <h2 class="result-title">Selesai! 🎉</h2>
      <p class="result-peserta" id="resultPeserta"></p>
    </div>

    <div class="score-circle">
      <div class="score-number" id="finalScore">—</div>
      <div class="score-label">DARI 100</div>
    </div>

    <div class="result-stats">
      <div class="stat ok">
        <span class="stat-value" id="statBenar">0</span>
        <span class="stat-label">BENAR</span>
      </div>
      <div class="stat no">
        <span class="stat-value" id="statSalah">0</span>
        <span class="stat-label">SALAH</span>
      </div>
      <div class="stat time">
        <span class="stat-value" id="statWaktu">-</span>
        <span class="stat-label">WAKTU</span>
      </div>
    </div>

    <p class="sync-status" id="syncStatus"></p>

    <button class="btn btn-primary" id="btnRestart" type="button" style="width:100%">🔄 Main Lagi</button>
  </section>

  <!-- ========== OVERLAY ========== -->
  <div class="overlay" id="overlay">
    <div style="text-align:center">
      <div class="spinner"></div>
      <p id="overlayText" style="font-weight:600;color:#667eea">Memuat…</p>
    </div>
  </div>

</div>

<script>
(() => {
  'use strict';

  // ============================================================
  //  KONFIGURASI
  // ============================================================
  const APPS_URL = 'https://script.google.com/macros/s/AKfycbwbZ4E_iXS_zCvWqpTjLq4ozyXBd8NzE-EVLc0jq3dEpnqFfyXFuwo141ufBL84Dd2r/exec';
  const SEKOLAH  = 'SD Negeri 1 Godegan';

  const PESERTA = [
    { id: 'fiola',  nama: 'Fiola',  grad: 'linear-gradient(135deg,#ec4899,#8b5cf6)' },
    { id: 'saiful', nama: 'Saiful', grad: 'linear-gradient(135deg,#3b82f6,#06b6d4)' },
    { id: 'kayla',  nama: 'Kayla',  grad: 'linear-gradient(135deg,#f59e0b,#ef4444)' },
  ];

  const TOTAL_SOAL = 25;
  const POIN       = 4;
  const WAKTU      = 20 * 60;                    // detik
  const KEY_BANK   = 'cc_pai_bank_v1';
  const KEY_DRAFT  = 'cc_pai_draft_v1';
  const TTL_BANK   = 6 * 60 * 60 * 1000;         // 6 jam

  // ============================================================
  //  DOM
  // ============================================================
  const $ = (id) => document.getElementById(id);
  const DOM = {
    screens: document.querySelectorAll('.screen'),
    quizScreen: $('scr-quiz'),
    pesertaGrid: $('pesertaGrid'),
    quizLabel: $('quizLabel'),
    timer: $('timer'),
    progressFill: $('progressFill'),
    questionText: $('questionText'),
    options: $('options'),
    btnPrev: $('btnPrev'),
    btnNext: $('btnNext'),
    resultPeserta: $('resultPeserta'),
    finalScore: $('finalScore'),
    statBenar: $('statBenar'),
    statSalah: $('statSalah'),
    statWaktu: $('statWaktu'),
    syncStatus: $('syncStatus'),
    btnRestart: $('btnRestart'),
    overlay: $('overlay'),
    overlayText: $('overlayText'),
  };

  // ============================================================
  //  STATE
  // ============================================================
  const state = {
    bank: [],
    soal: [],
    jawaban: [],
    idx: 0,
    sisa: WAKTU,
    timerId: null,
    peserta: null,
    mulaiAt: 0,
    submitting: false,
  };

  // ============================================================
  //  CACHE — localStorage + TTL
  // ============================================================
  const cache = {
    get(key, ttl) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const { v, t } = JSON.parse(raw);
        if (ttl && Date.now() - t > ttl) { localStorage.removeItem(key); return null; }
        return v;
      } catch { return null; }
    },
    set(key, val) {
      try { localStorage.setItem(key, JSON.stringify({ v: val, t: Date.now() })); }
      catch { /* quota exceeded — abaikan */ }
    },
    del(key) { localStorage.removeItem(key); },
  };

  // ============================================================
  //  JSONP — bypass CORS dengan timeout
  // ============================================================
  function jsonp(action, params = {}, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const cb = '__cb_' + Date.now() + Math.random().toString(36).slice(2, 6);
      const script = document.createElement('script');
      const query = new URLSearchParams({ action, callback: cb, ...params });
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('Timeout koneksi'));
      }, timeoutMs);

      const cleanup = () => {
        clearTimeout(timer);
        delete window[cb];
        script.remove();
      };

      window[cb] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('Gagal terhubung ke server')); };
      script.src = `${APPS_URL}?${query}`;
      document.body.appendChild(script);
    });
  }

  // ============================================================
  //  UTIL
  // ============================================================
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const normalizeSoal = (s) => {
    const o = s.opsi || {};
    return {
      id: s.id,
      pertanyaan: s.pertanyaan || s.Pertanyaan || '',
      opsi: {
        A: o.A ?? s.a ?? s.OpsiA ?? '',
        B: o.B ?? s.b ?? s.OpsiB ?? '',
        C: o.C ?? s.c ?? s.OpsiC ?? '',
        D: o.D ?? s.d ?? s.OpsiD ?? '',
      },
    };
  };

  const pad2 = (n) => String(n).padStart(2, '0');
  const formatWaktu = (d) => `${pad2(Math.floor(d / 60))}:${pad2(d % 60)}`;

  // ============================================================
  //  SCREEN NAV
  // ============================================================
  const go = (id) => {
    DOM.screens.forEach((s) => s.classList.toggle('active', s.id === id));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const showOverlay = (text = 'Memuat…') => {
    DOM.overlayText.textContent = text;
    DOM.overlay.classList.add('active');
  };
  const hideOverlay = () => DOM.overlay.classList.remove('active');

  // ============================================================
  //  WELCOME
  // ============================================================
  function renderPeserta() {
    const frag = document.createDocumentFragment();
    PESERTA.forEach((p) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'peserta-card';
      btn.dataset.id = p.id;
      btn.innerHTML = `
        <div class="avatar" style="background:${p.grad}">${p.nama[0]}</div>
        <div class="peserta-name">${p.nama}</div>
      `;
      frag.appendChild(btn);
    });
    DOM.pesertaGrid.replaceChildren(frag);
  }

  // ============================================================
  //  BANK SOAL — cache-first
  // ============================================================
  async function muatBankSoal() {
    const cached = cache.get(KEY_BANK, TTL_BANK);
    if (cached?.length) {
      state.bank = cached;
      return { source: 'cache', total: cached.length };
    }

    const res = await jsonp('getBankSoal');
    if (res.status !== 'ok') throw new Error(res.message || 'Server error');
    const soal = res.soal || res.bank || [];
    if (!soal.length) throw new Error('Bank soal kosong');

    state.bank = soal.map(normalizeSoal);
    cache.set(KEY_BANK, state.bank);
    return { source: 'server', total: state.bank.length };
  }

  // ============================================================
  //  MULAI
  // ============================================================
  async function mulaiKuis(peserta) {
    state.peserta = peserta;
    showOverlay('Menyiapkan soal…');

    try {
      if (!state.bank.length) await muatBankSoal();

      if (state.bank.length < TOTAL_SOAL) {
        throw new Error(`Bank soal kurang dari ${TOTAL_SOAL} (saat ini ${state.bank.length})`);
      }

      state.soal = shuffle(state.bank).slice(0, TOTAL_SOAL);
      state.jawaban = new Array(TOTAL_SOAL).fill(null);
      state.idx = 0;
      state.sisa = WAKTU;
      state.mulaiAt = Date.now();
      state.submitting = false;

      // Restore draft kalau refresh di tengah ujian
      const draft = cache.get(KEY_DRAFT);
      if (draft?.ids && draft.ids.join(',') === state.soal.map((s) => s.id).join(',')) {
        state.jawaban = draft.jawaban;
      }

      renderSoal();
      go('scr-quiz');
      startTimer();
    } catch (err) {
      alert('Gagal memuat soal: ' + err.message);
      go('scr-welcome');
    } finally {
      hideOverlay();
    }
  }

  // ============================================================
  //  RENDER SOAL
  // ============================================================
  function renderSoal() {
    const s = state.soal[state.idx];

    DOM.quizLabel.textContent = `Soal ${state.idx + 1} / ${state.soal.length}`;
    DOM.questionText.textContent = s.pertanyaan;
    DOM.progressFill.style.width = `${((state.idx + 1) / state.soal.length) * 100}%`;

    const frag = document.createDocumentFragment();
    ['A', 'B', 'C', 'D'].forEach((letter) => {
      const div = document.createElement('div');
      div.className = 'option' + (state.jawaban[state.idx] === letter ? ' selected' : '');
      div.dataset.letter = letter;
      div.setAttribute('role', 'button');
      div.setAttribute('tabindex', '0');

      const badge = document.createElement('div');
      badge.className = 'option-letter';
      badge.textContent = letter;

      const txt = document.createElement('div');
      txt.className = 'option-text';
      txt.textContent = s.opsi[letter];

      div.append(badge, txt);
      frag.appendChild(div);
    });
    DOM.options.replaceChildren(frag);

    DOM.btnPrev.disabled = state.idx === 0;
    DOM.btnNext.textContent =
      state.idx === state.soal.length - 1 ? 'Selesai ✓' : 'Selanjutnya →';
  }

  function pilihJawaban(letter) {
    state.jawaban[state.idx] = letter;
    DOM.options.querySelectorAll('.option').forEach((el) => {
      el.classList.toggle('selected', el.dataset.letter === letter);
    });
    cache.set(KEY_DRAFT, {
      ids: state.soal.map((s) => s.id),
      jawaban: state.jawaban,
    });
  }

  function nextSoal() {
    if (state.idx < state.soal.length - 1) {
      state.idx++;
      renderSoal();
    } else {
      const belum = state.jawaban.filter((j) => j === null).length;
      const pesan = belum
        ? `Masih ada ${belum} soal belum dijawab. Selesaikan sekarang?`
        : 'Selesaikan ujian sekarang?';
      if (confirm(pesan)) selesaiKuis();
    }
  }

  function prevSoal() {
    if (state.idx > 0) { state.idx--; renderSoal(); }
  }

  // ============================================================
  //  TIMER
  // ============================================================
  function startTimer() {
    clearInterval(state.timerId);
    updateTimer();
    state.timerId = setInterval(() => {
      state.sisa--;
      updateTimer();
      if (state.sisa <= 0) {
        clearInterval(state.timerId);
        alert('⏰ Waktu habis! Jawaban dikumpulkan otomatis.');
        selesaiKuis();
      }
    }, 1000);
  }

  function updateTimer() {
    DOM.timer.textContent = formatWaktu(state.sisa);
    DOM.timer.classList.toggle('warning', state.sisa <= 60);
  }

  // ============================================================
  //  SELESAI
  // ============================================================
  async function selesaiKuis() {
    if (state.submitting) return;
    state.submitting = true;
    clearInterval(state.timerId);

    const durasi = Math.min(WAKTU, Math.floor((Date.now() - state.mulaiAt) / 1000));
    const peserta = state.peserta;

    const payload = {
      nama: peserta.nama,
      sekolah: SEKOLAH,
      totalSoal: TOTAL_SOAL,
      jawaban: state.soal.map((s, i) => ({ id: s.id, jawaban: state.jawaban[i] })),
    };

    DOM.resultPeserta.textContent = `${peserta.nama} · ${SEKOLAH}`;
    DOM.finalScore.textContent = '…';
    DOM.statBenar.textContent = '—';
    DOM.statSalah.textContent = '—';
    DOM.statWaktu.textContent = formatWaktu(durasi);
    DOM.syncStatus.textContent = '⏳ Mengirim ke server…';
    DOM.btnRestart.disabled = true;
    go('scr-result');
    cache.del(KEY_DRAFT);

    try {
      const res = await jsonp('submit', { data: JSON.stringify(payload) });
      if (res.status !== 'ok') throw new Error(res.message || 'Server error');
      tampilkanHasil(res);
      DOM.syncStatus.textContent = '✅ Tersimpan di server';
    } catch (err) {
      DOM.finalScore.textContent = '—';
      DOM.syncStatus.textContent = '⚠️ Gagal kirim — catat hasil manual, lalu hubungi panitia';
      console.error(err);
    } finally {
      DOM.btnRestart.disabled = false;
      state.submitting = false;
    }
  }

  function tampilkanHasil(res) {
    DOM.statBenar.textContent = res.benar;
    DOM.statSalah.textContent = res.salah;
    animateNumber(DOM.finalScore, 0, res.nilai, 900);
  }

  function animateNumber(el, from, to, dur) {
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(from + (to - from) * eased);
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ============================================================
  //  EVENT BINDING
  // ============================================================
  function bindEvents() {
    // Pilih peserta (delegated)
    DOM.pesertaGrid.addEventListener('click', (e) => {
      const card = e.target.closest('.peserta-card');
      if (!card) return;
      const peserta = PESERTA.find((p) => p.id === card.dataset.id);
      if (peserta) mulaiKuis(peserta);
    });

    // Pilih jawaban (delegated)
    DOM.options.addEventListener('click', (e) => {
      const opt = e.target.closest('.option');
      if (opt) pilihJawaban(opt.dataset.letter);
    });

    DOM.btnNext.addEventListener('click', nextSoal);
    DOM.btnPrev.addEventListener('click', prevSoal);

    DOM.btnRestart.addEventListener('click', () => {
      state.soal = [];
      state.jawaban = [];
      go('scr-welcome');
    });

    // Keyboard shortcut (hanya aktif di screen quiz)
    document.addEventListener('keydown', (e) => {
      if (!DOM.quizScreen.classList.contains('active')) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C', 'D'].includes(k)) {
        e.preventDefault(); pilihJawaban(k);
      } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
        e.preventDefault(); nextSoal();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault(); prevSoal();
      }
    });

    // Peringatan sebelum refresh di tengah ujian
    window.addEventListener('beforeunload', (e) => {
      if (DOM.quizScreen.classList.contains('active') && !state.submitting) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  }

  // ============================================================
  //  INIT
  // ============================================================
  function init() {
    renderPeserta();
    bindEvents();
    // Prefetch bank soal di background
    muatBankSoal().catch((err) => console.warn('Prefetch gagal:', err.message));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
