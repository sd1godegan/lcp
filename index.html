<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Cerdas Cermat PAI · SDN 1 Godegan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS — PASTEL PALETTE, NO GRADIENT
   ============================================================ */
:root{
  /* Base surfaces */
  --bg:            #F7F5F0;
  --bg-alt:        #F2EFE8;
  --surface:       #FFFFFF;
  --surface-alt:   #F6F3EC;
  --surface-sunken:#EDE9E0;

  /* Ink */
  --ink:        #2B2D3A;
  --ink-soft:   #565A6C;
  --ink-muted:  #969AAC;
  --ink-faint:  #C4C7D2;

  /* Pastel accents */
  --lavender:      #DDD4F0;
  --lavender-soft: #EFEAF8;
  --lavender-deep: #8B7DC4;

  --mint:          #C8E6D7;
  --mint-soft:     #E5F4ED;
  --mint-deep:     #5FAA8B;

  --peach:         #FFD9C0;
  --peach-soft:    #FFEDE2;
  --peach-deep:    #E5805A;

  --pink:          #F8D0DD;
  --pink-soft:     #FBE8EF;
  --pink-deep:     #D07098;

  --sky:           #CFE3F1;
  --sky-soft:      #E6F1F8;
  --sky-deep:      #5E94BC;

  --butter:        #FFE9B8;
  --butter-soft:   #FFF4D9;
  --butter-deep:   #D5A23F;

  /* Semantic */
  --success:       var(--mint-deep);
  --success-soft:  var(--mint-soft);
  --danger:        #D96868;
  --danger-soft:   #FBE9E9;
  --warning:       var(--butter-deep);
  --warning-soft:  var(--butter-soft);
  --info:          var(--lavender-deep);
  --info-soft:     var(--lavender-soft);

  /* Lines */
  --line:      #E8E4DB;
  --line-soft: #F0EDE6;

  /* Shadow — soft, flat */
  --sh-xs: 0 1px 2px rgba(43,45,58,.04);
  --sh-sm: 0 1px 3px rgba(43,45,58,.06), 0 1px 2px rgba(43,45,58,.04);
  --sh-md: 0 4px 12px rgba(43,45,58,.06);
  --sh-lg: 0 12px 32px rgba(43,45,58,.08);
  --sh-xl: 0 24px 48px rgba(43,45,58,.10);

  /* Radius */
  --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-full: 999px;

  /* Motion */
  --t-fast: .14s cubic-bezier(.4,0,.2,1);
  --t: .22s cubic-bezier(.4,0,.2,1);
  --t-bounce: .4s cubic-bezier(.34,1.4,.64,1);

  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  min-height:100vh;min-height:100dvh;
  color:var(--ink);
  background:var(--bg);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  position:relative;
}
/* Very subtle noise for warmth */
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:.5;
  background-image:radial-gradient(rgba(43,45,58,.035) 1px, transparent 1px);
  background-size:20px 20px;
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app-wrap{
  min-height:100vh;min-height:100dvh;
  display:grid;place-items:center;
  padding:clamp(12px,3vw,28px);
  position:relative;z-index:1;
}

.app{
  width:100%;max-width:680px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);
  padding:clamp(24px,5vw,40px);
  position:relative;overflow:hidden;
  animation:appIn .45s var(--t-bounce) both;
}
@keyframes appIn{
  from{opacity:0;transform:translateY(16px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ============================================================
   SCREENS
   ============================================================ */
.screen{display:none}
.screen.active{display:block;animation:screenIn .35s var(--t) both}
@keyframes screenIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============================================================
   WELCOME — BRAND
   ============================================================ */
.brand{text-align:center;margin-bottom:clamp(26px,5vw,36px)}

.brand-logo{
  width:72px;height:72px;
  margin:0 auto 20px;
  border-radius:22px;
  background:var(--lavender-deep);
  display:grid;place-items:center;
  box-shadow:0 10px 24px rgba(139,125,196,.28);
  animation:logoFloat 4s ease-in-out infinite;
  position:relative;
}
.brand-logo svg{width:34px;height:34px;color:#fff;stroke-width:2.2}
/* Small accent dot as decorative element */
.brand-logo::after{
  content:'';position:absolute;
  right:-6px;bottom:-6px;
  width:20px;height:20px;border-radius:50%;
  background:var(--peach);
  border:3px solid var(--surface);
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

.brand-title{
  font-size:clamp(24px,5vw,30px);font-weight:800;
  letter-spacing:-.03em;line-height:1.2;
  color:var(--ink);margin-bottom:8px;
}
.brand-sub{
  font-size:clamp(13px,2.6vw,14px);
  color:var(--ink-soft);font-weight:500;
}

.brand-badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:14px;padding:5px 12px 5px 8px;
  background:var(--mint-soft);
  border:1px solid var(--mint);
  border-radius:var(--r-full);
  font-size:11px;font-weight:700;letter-spacing:.05em;
  color:var(--mint-deep);text-transform:uppercase;
}
.brand-badge::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--mint-deep);
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.3);opacity:.6}
}

/* ============================================================
   SECTION LABEL
   ============================================================ */
.section-label{
  font-size:13px;font-weight:600;
  color:var(--ink-soft);text-align:center;
  margin-bottom:18px;
}

/* ============================================================
   PESERTA CARDS
   ============================================================ */
.peserta-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(8px,2vw,12px);margin-bottom:26px;
}

.peserta-card{
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:var(--r-lg);
  padding:clamp(18px,3.5vw,24px) clamp(8px,2vw,14px);
  cursor:pointer;
  transition:all var(--t);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  font-family:inherit;color:inherit;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.peserta-card:hover{
  border-color:var(--lavender-deep);
  background:var(--lavender-soft);
  transform:translateY(-4px);
  box-shadow:0 8px 20px rgba(139,125,196,.15);
}
.peserta-card:active{transform:translateY(-2px) scale(.99)}
.peserta-card:focus-visible{
  outline:3px solid var(--lavender-deep);
  outline-offset:3px;
}

.avatar{
  width:clamp(54px,12vw,64px);height:clamp(54px,12vw,64px);
  border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:clamp(20px,4.5vw,24px);
  transition:transform var(--t-bounce);
  border:3px solid var(--surface);
  box-shadow:var(--sh-sm);
}
.peserta-card:hover .avatar{transform:scale(1.06) rotate(-4deg)}

.peserta-name{
  font-weight:700;font-size:clamp(14px,3vw,15px);
  color:var(--ink);
}

/* ============================================================
   INFO STRIP
   ============================================================ */
.info-strip{
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:16px 12px;
  background:var(--surface-alt);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
}
.info-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative;
}
.info-item:not(:last-child)::after{
  content:'';position:absolute;right:0;top:20%;
  height:60%;width:1px;background:var(--line);
}
.info-icon{
  width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;
}
.info-icon svg{width:15px;height:15px;stroke-width:2.4}
.info-icon.i1{background:var(--lavender);color:var(--lavender-deep)}
.info-icon.i2{background:var(--butter);color:var(--butter-deep)}
.info-icon.i3{background:var(--mint);color:var(--mint-deep)}
.info-value{
  font-size:clamp(15px,3.4vw,17px);font-weight:800;
  color:var(--ink);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.info-label{
  font-size:10px;font-weight:700;color:var(--ink-muted);
  text-transform:uppercase;letter-spacing:.07em;
}

/* ============================================================
   QUIZ HEADER
   ============================================================ */
.quiz-top{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;gap:12px;
}

.quiz-counter{display:flex;flex-direction:column;gap:2px}
.quiz-counter-label{
  font-size:10px;font-weight:700;color:var(--ink-muted);
  text-transform:uppercase;letter-spacing:.08em;
}
.quiz-counter-value{
  font-size:clamp(15px,3.4vw,17px);font-weight:800;
  color:var(--ink);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.quiz-counter-value span{color:var(--lavender-deep)}

.timer-chip{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px 8px 12px;
  background:var(--surface-alt);
  border:1px solid var(--line);
  border-radius:var(--r-full);
  font-weight:700;font-size:clamp(14px,3vw,15px);
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  transition:all var(--t);
}
.timer-chip svg{width:15px;height:15px;color:var(--ink-muted)}
.timer-chip.warning{
  background:var(--butter-soft);
  border-color:var(--butter);
  color:var(--butter-deep);
}
.timer-chip.warning svg{color:var(--butter-deep)}
.timer-chip.danger{
  background:var(--danger);
  border-color:var(--danger);
  color:#fff;
  animation:timerPulse 1.2s ease-in-out infinite;
}
.timer-chip.danger svg{color:#fff}
@keyframes timerPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}

/* ============================================================
   PROGRESS
   ============================================================ */
.progress-wrap{
  display:flex;align-items:center;gap:12px;
  margin-bottom:24px;
}
.progress-track{
  flex:1;height:6px;
  background:var(--surface-sunken);
  border-radius:var(--r-full);overflow:hidden;
}
.progress-fill{
  height:100%;background:var(--lavender-deep);
  border-radius:var(--r-full);
  width:0;transition:width .5s var(--t);
}
.progress-pct{
  font-size:12px;font-weight:700;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  min-width:36px;text-align:right;
}

/* ============================================================
   QUESTION
   ============================================================ */
.question-card{
  background:var(--lavender-soft);
  padding:clamp(20px,4vw,26px);
  border-radius:var(--r-lg);
  margin-bottom:20px;min-height:110px;
  display:flex;align-items:center;
  border-left:4px solid var(--lavender-deep);
}
.question-text{
  font-size:clamp(15px,3.3vw,17px);
  line-height:1.6;font-weight:600;
  color:var(--ink);
}
.question-anim{animation:qSlide .3s var(--t) both}
@keyframes qSlide{
  from{opacity:0;transform:translateX(12px)}
  to{opacity:1;transform:translateX(0)}
}

/* ============================================================
   OPTIONS
   ============================================================ */
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}

.option{
  display:flex;align-items:center;gap:14px;
  padding:clamp(13px,2.8vw,16px) clamp(14px,3vw,18px);
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:all var(--t);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.option:hover{
  border-color:var(--lavender-deep);
  background:var(--lavender-soft);
  transform:translateX(4px);
}
.option:active{transform:translateX(4px) scale(.995)}

.option.selected{
  border-color:var(--lavender-deep);
  background:var(--lavender-soft);
  box-shadow:0 0 0 3px rgba(139,125,196,.15);
}

.option-letter{
  width:34px;height:34px;
  border-radius:50%;
  background:var(--surface-alt);
  color:var(--ink-soft);
  display:grid;place-items:center;
  font-weight:800;font-size:14px;
  flex-shrink:0;
  transition:all var(--t-bounce);
}
.option:hover .option-letter{
  background:var(--lavender);
  color:var(--lavender-deep);
}
.option.selected .option-letter{
  background:var(--lavender-deep);
  color:#fff;
  transform:scale(1.06);
}

.option-text{
  flex:1;font-size:clamp(14px,3vw,15.5px);
  line-height:1.45;font-weight:500;
  color:var(--ink-soft);
  transition:color var(--t);
}
.option.selected .option-text{
  color:var(--ink);font-weight:600;
}

/* ============================================================
   BUTTONS — SOLID PASTEL, NO GRADIENT
   ============================================================ */
.btn{
  padding:clamp(13px,2.7vw,15px) clamp(20px,4vw,26px);
  border:none;border-radius:var(--r-md);
  font-family:inherit;
  font-size:clamp(14px,3vw,15px);
  font-weight:700;letter-spacing:-.01em;
  cursor:pointer;
  transition:all var(--t);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  -webkit-tap-highlight-color:transparent;
}
.btn svg{width:16px;height:16px;stroke-width:2.5}

.btn-primary{
  background:var(--lavender-deep);
  color:#fff;
  box-shadow:0 4px 14px rgba(139,125,196,.3);
}
.btn-primary:hover:not(:disabled){
  background:#7B6CB8;
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(139,125,196,.4);
}
.btn-secondary{
  background:var(--surface-alt);
  color:var(--ink);
  border:1px solid var(--line);
}
.btn-secondary:hover:not(:disabled){
  background:var(--surface-sunken);
  border-color:var(--ink-faint);
}
.btn:disabled{
  opacity:.35;
  cursor:not-allowed;
  box-shadow:none;
  transform:none;
}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:focus-visible{
  outline:3px solid var(--lavender-deep);
  outline-offset:2px;
}

.nav-buttons{display:flex;gap:10px}
.nav-buttons .btn{flex:1}

/* ============================================================
   HINT
   ============================================================ */
.hint{
  text-align:center;font-size:11px;
  color:var(--ink-muted);font-weight:500;
  margin-top:16px;
  display:flex;align-items:center;justify-content:center;
  gap:6px;flex-wrap:wrap;
}
.hint kbd{
  background:var(--surface-alt);
  border:1px solid var(--line);
  border-bottom-width:2px;
  border-radius:5px;
  padding:2px 6px;
  font-family:ui-monospace,'SF Mono',monospace;
  font-size:10px;font-weight:700;
  color:var(--ink-soft);
  min-width:20px;display:inline-block;text-align:center;
}

/* ============================================================
   RESULT
   ============================================================ */
.result-head{text-align:center;margin-bottom:24px}
.result-emoji{
  font-size:52px;margin-bottom:10px;
  animation:emojiPop .5s var(--t-bounce) both;
}
@keyframes emojiPop{
  0%{transform:scale(0);opacity:0}
  60%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}
.result-title{
  font-size:clamp(22px,5vw,26px);font-weight:800;
  letter-spacing:-.03em;color:var(--ink);
  margin-bottom:6px;
}
.result-peserta{
  color:var(--ink-soft);font-size:clamp(13px,3vw,14px);font-weight:500;
}

/* Score Ring */
.score-ring-wrap{
  position:relative;width:190px;height:190px;
  margin:22px auto;
  display:grid;place-items:center;
}
.score-ring{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.score-ring .track{stroke:var(--surface-sunken)}
.score-ring .progress{
  stroke:var(--lavender-deep);
  stroke-dasharray:565.48;
  stroke-dashoffset:565.48;
  transition:stroke-dashoffset 1.3s var(--t);
}

.score-inner{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2px;
}
.score-number{
  font-size:clamp(50px,12vw,64px);
  font-weight:800;letter-spacing:-.04em;
  color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums;
}
.score-label{
  font-size:11px;font-weight:700;
  color:var(--ink-muted);letter-spacing:.1em;
  text-transform:uppercase;
}

/* Stats */
.result-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin-bottom:18px;
}
.stat{
  text-align:center;
  padding:16px 8px;
  background:var(--surface-alt);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  transition:transform var(--t);
}
.stat:hover{transform:translateY(-2px)}
.stat-icon{
  width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;margin:0 auto 8px;
}
.stat-icon svg{width:16px;height:16px;stroke-width:2.5}
.stat-icon.ok{background:var(--mint);color:var(--mint-deep)}
.stat-icon.no{background:var(--pink);color:var(--pink-deep)}
.stat-icon.tm{background:var(--sky);color:var(--sky-deep)}
.stat-value{
  font-size:clamp(18px,4vw,22px);font-weight:800;
  color:var(--ink);letter-spacing:-.02em;
  display:block;margin-bottom:2px;
  font-variant-numeric:tabular-nums;
}
.stat-label{
  font-size:10px;font-weight:700;
  color:var(--ink-muted);
  letter-spacing:.06em;text-transform:uppercase;
}

.sync-status{
  text-align:center;font-size:12px;
  color:var(--ink-muted);font-weight:500;
  margin-bottom:16px;min-height:18px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.sync-status.ok{color:var(--mint-deep)}
.sync-status.err{color:var(--danger)}

/* ============================================================
   TOAST
   ============================================================ */
.toast-container{
  position:fixed;top:20px;right:20px;z-index:9999;
  display:flex;flex-direction:column;gap:10px;
  max-width:min(340px,calc(100vw - 40px));
  pointer-events:none;
}
.toast{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:14px 14px 14px 16px;
  box-shadow:var(--sh-lg);
  display:flex;align-items:flex-start;gap:12px;
  pointer-events:auto;
  animation:toastIn .35s var(--t-bounce) both;
  position:relative;overflow:hidden;
}
.toast::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:4px;background:var(--lavender-deep);
}
.toast.success::before{background:var(--mint-deep)}
.toast.error::before{background:var(--danger)}
.toast.info::before{background:var(--lavender-deep)}
.toast.warning::before{background:var(--butter-deep)}

.toast.out{animation:toastOut .25s var(--t) both}
@keyframes toastIn{
  from{opacity:0;transform:translateX(120%)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes toastOut{
  to{opacity:0;transform:translateX(120%)}
}

.toast-icon{
  width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;flex-shrink:0;
}
.toast-icon svg{width:16px;height:16px;stroke-width:2.5}
.toast.success .toast-icon{background:var(--mint);color:var(--mint-deep)}
.toast.error .toast-icon{background:var(--danger-soft);color:var(--danger)}
.toast.info .toast-icon{background:var(--lavender);color:var(--lavender-deep)}
.toast.warning .toast-icon{background:var(--butter);color:var(--butter-deep)}

.toast-body{flex:1;min-width:0}
.toast-title{
  font-size:13.5px;font-weight:700;
  color:var(--ink);margin-bottom:2px;
  letter-spacing:-.01em;
}
.toast-msg{
  font-size:12.5px;color:var(--ink-soft);
  line-height:1.4;word-wrap:break-word;
}

.toast-close{
  width:24px;height:24px;
  background:transparent;border:none;cursor:pointer;
  color:var(--ink-muted);border-radius:6px;
  display:grid;place-items:center;flex-shrink:0;
  transition:all var(--t-fast);
}
.toast-close:hover{background:var(--surface-alt);color:var(--ink)}
.toast-close svg{width:13px;height:13px;stroke-width:2.5}

/* ============================================================
   MODAL
   ============================================================ */
.modal-backdrop{
  position:fixed;inset:0;z-index:10000;
  background:rgba(43,45,58,.35);
  display:grid;place-items:center;
  padding:20px;
  opacity:0;pointer-events:none;
  transition:opacity var(--t);
}
.modal-backdrop.active{opacity:1;pointer-events:auto}

.modal{
  width:100%;max-width:380px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-xl);
  padding:28px 24px 24px;
  box-shadow:var(--sh-xl);
  transform:scale(.94) translateY(12px);
  transition:transform var(--t-bounce);
  text-align:center;
}
.modal-backdrop.active .modal{transform:scale(1) translateY(0)}

.modal-icon{
  width:56px;height:56px;border-radius:16px;
  display:grid;place-items:center;margin:0 auto 18px;
  background:var(--lavender-soft);
  color:var(--lavender-deep);
}
.modal-icon svg{width:26px;height:26px;stroke-width:2.2}
.modal-icon.warn{background:var(--butter-soft);color:var(--butter-deep)}
.modal-icon.danger{background:var(--danger-soft);color:var(--danger)}

.modal-title{
  font-size:19px;font-weight:800;color:var(--ink);
  margin-bottom:8px;letter-spacing:-.02em;
}
.modal-msg{
  font-size:14px;color:var(--ink-soft);
  line-height:1.55;margin-bottom:22px;
}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn{flex:1}

/* ============================================================
   LOADING OVERLAY
   ============================================================ */
.loading-overlay{
  position:fixed;inset:0;z-index:9998;
  background:rgba(247,245,240,.85);
  display:grid;place-items:center;
  opacity:0;pointer-events:none;
  transition:opacity var(--t);
}
.loading-overlay.active{opacity:1;pointer-events:auto}

.loader{display:flex;flex-direction:column;align-items:center;gap:14px}
.loader-dots{display:flex;gap:8px}
.loader-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--lavender-deep);
  animation:dotBounce 1.2s ease-in-out infinite;
}
.loader-dot:nth-child(2){animation-delay:.15s;background:var(--pink-deep)}
.loader-dot:nth-child(3){animation-delay:.3s;background:var(--mint-deep)}
@keyframes dotBounce{
  0%,80%,100%{transform:scale(.55);opacity:.4}
  40%{transform:scale(1);opacity:1}
}
.loader-text{
  font-size:14px;font-weight:600;
  color:var(--ink-soft);
}

/* ============================================================
   CONFETTI
   ============================================================ */
.confetti-container{
  position:fixed;inset:0;pointer-events:none;z-index:9997;overflow:hidden;
}
.confetti{
  position:absolute;width:10px;height:10px;top:-20px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  to{transform:translateY(100vh) rotate(720deg)}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:520px){
  .toast-container{top:12px;right:12px;left:12px;max-width:none}
  .result-stats{gap:8px}
  .stat{padding:12px 6px}
  .modal{padding:24px 20px 20px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>

<script>
(() => {
  'use strict';

  // ============================================================
  //  KONFIGURASI
  // ============================================================
  const APPS_URL = 'https://script.google.com/macros/s/AKfycbwbZ4E_iXS_zCvWqpTjLq4ozyXBd8NzE-EVLc0jq3dEpnqFfyXFuwo141ufBL84Dd2r/exec';
  const SEKOLAH  = 'SD Negeri 1 Godegan';

  const PESERTA = [
    { id: 'fiola',  nama: 'Fiola',  bg: '#8B7DC4' },  // lavender
    { id: 'saiful', nama: 'Saiful', bg: '#5E94BC' },  // sky
    { id: 'kayla',  nama: 'Kayla',  bg: '#D07098' },  // pink
  ];

  const TOTAL_SOAL = 25;
  const POIN       = 4;
  const WAKTU      = 20 * 60;
  const KEY_BANK   = 'cc_pai_bank_v2';
  const KEY_DRAFT  = 'cc_pai_draft_v2';
  const TTL_BANK   = 6 * 60 * 60 * 1000;

  // Warna pastel untuk confetti
  const CONFETTI_COLORS = ['#DDD4F0','#C8E6D7','#FFD9C0','#F8D0DD','#CFE3F1','#FFE9B8'];

  // ============================================================
  //  DOM
  // ============================================================
  const $ = id => document.getElementById(id);
  const DOM = {
    screens: document.querySelectorAll('.screen'),
    quizScreen: $('scr-quiz'),
    pesertaGrid: $('pesertaGrid'),
    qNum: $('qNum'),
    timerChip: $('timerChip'),
    timerText: $('timerText'),
    progressFill: $('progressFill'),
    progressPct: $('progressPct'),
    questionCard: $('questionCard'),
    questionText: $('questionText'),
    options: $('options'),
    btnPrev: $('btnPrev'),
    btnNext: $('btnNext'),
    resultEmoji: $('resultEmoji'),
    resultTitle: $('resultTitle'),
    resultPeserta: $('resultPeserta'),
    finalScore: $('finalScore'),
    scoreProgress: $('scoreProgress'),
    statBenar: $('statBenar'),
    statSalah: $('statSalah'),
    statWaktu: $('statWaktu'),
    syncStatus: $('syncStatus'),
    btnRestart: $('btnRestart'),
    toastContainer: $('toastContainer'),
    modalBackdrop: $('modalBackdrop'),
    modalIcon: $('modalIcon'),
    modalTitle: $('modalTitle'),
    modalMsg: $('modalMsg'),
    modalCancel: $('modalCancel'),
    modalConfirm: $('modalConfirm'),
    loadingOverlay: $('loadingOverlay'),
    loaderText: $('loaderText'),
  };

  // ============================================================
  //  STATE
  // ============================================================
  const state = {
    bank: [], soal: [], jawaban: [],
    idx: 0, sisa: WAKTU, timerId: null,
    peserta: null, mulaiAt: 0, submitting: false,
  };

  // ============================================================
  //  TOAST
  // ============================================================
  const TOAST_ICONS = {
    success: '<polyline points="20 6 9 17 4 12"/>',
    error:   '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
    warning: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    info:    '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  };

  function toast(type, title, msg = '', duration = 4000) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = `
      <div class="toast-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${TOAST_ICONS[type] || TOAST_ICONS.info}</svg>
      </div>
      <div class="toast-body">
        <div class="toast-title">${title}</div>
        ${msg ? `<div class="toast-msg">${msg}</div>` : ''}
      </div>
      <button class="toast-close" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    `;
    const remove = () => { el.classList.add('out'); setTimeout(() => el.remove(), 250); };
    el.querySelector('.toast-close').addEventListener('click', remove);
    DOM.toastContainer.appendChild(el);
    if (duration > 0) setTimeout(remove, duration);
    return el;
  }

  // ============================================================
  //  MODAL
  // ============================================================
  function confirmModal({ title, msg, icon = 'info', confirmText = 'Ya', cancelText = 'Batal' }) {
    return new Promise(resolve => {
      DOM.modalTitle.textContent = title;
      DOM.modalMsg.textContent = msg;
      DOM.modalConfirm.textContent = confirmText;
      DOM.modalCancel.textContent = cancelText;
      DOM.modalIcon.className = 'modal-icon' +
        (icon === 'warn' ? ' warn' : icon === 'danger' ? ' danger' : '');
      DOM.modalBackdrop.classList.add('active');

      const cleanup = () => {
        DOM.modalBackdrop.classList.remove('active');
        DOM.modalConfirm.removeEventListener('click', onYes);
        DOM.modalCancel.removeEventListener('click', onNo);
        DOM.modalBackdrop.removeEventListener('click', onBackdrop);
      };
      const onYes = () => { cleanup(); resolve(true); };
      const onNo  = () => { cleanup(); resolve(false); };
      const onBackdrop = e => { if (e.target === DOM.modalBackdrop) onNo(); };

      DOM.modalConfirm.addEventListener('click', onYes);
      DOM.modalCancel.addEventListener('click', onNo);
      DOM.modalBackdrop.addEventListener('click', onBackdrop);
    });
  }

  // ============================================================
  //  LOADING
  // ============================================================
  const showLoading = (text = 'Memuat…') => {
    DOM.loaderText.textContent = text;
    DOM.loadingOverlay.classList.add('active');
  };
  const hideLoading = () => DOM.loadingOverlay.classList.remove('active');

  // ============================================================
  //  CACHE
  // ============================================================
  const cache = {
    get(key, ttl) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const { v, t } = JSON.parse(raw);
        if (ttl && Date.now() - t > ttl) { localStorage.removeItem(key); return null; }
        return v;
      } catch { return null; }
    },
    set(key, val) {
      try { localStorage.setItem(key, JSON.stringify({ v: val, t: Date.now() })); } catch {}
    },
    del(key) { localStorage.removeItem(key); },
  };

  // ============================================================
  //  JSONP
  // ============================================================
  function jsonp(action, params = {}, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const cb = '__cb_' + Date.now() + Math.random().toString(36).slice(2, 6);
      const script = document.createElement('script');
      const query = new URLSearchParams({ action, callback: cb, ...params });
      const timer = setTimeout(() => { cleanup(); reject(new Error('Koneksi timeout')); }, timeoutMs);
      const cleanup = () => { clearTimeout(timer); delete window[cb]; script.remove(); };

      window[cb] = data => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('Tidak dapat terhubung ke server')); };
      script.src = `${APPS_URL}?${query}`;
      document.body.appendChild(script);
    });
  }

  // ============================================================
  //  UTIL
  // ============================================================
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const normalizeSoal = s => {
    const o = s.opsi || {};
    return {
      id: s.id,
      pertanyaan: s.pertanyaan || s.Pertanyaan || '',
      opsi: {
        A: o.A ?? s.a ?? s.OpsiA ?? '',
        B: o.B ?? s.b ?? s.OpsiB ?? '',
        C: o.C ?? s.c ?? s.OpsiC ?? '',
        D: o.D ?? s.d ?? s.OpsiD ?? '',
      },
    };
  };

  const pad2 = n => String(n).padStart(2, '0');
  const fmtTime = d => `${pad2(Math.floor(d / 60))}:${pad2(d % 60)}`;

  const go = id => {
    DOM.screens.forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // ============================================================
  //  CONFETTI — pastel colors
  // ============================================================
  function fireConfetti(count = 50) {
    const container = document.createElement('div');
    container.className = 'confetti-container';
    document.body.appendChild(container);

    const shapes = ['50%', '0%', '20%'];

    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      c.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
      c.style.width = (6 + Math.random() * 8) + 'px';
      c.style.height = (6 + Math.random() * 8) + 'px';
      const dur = 2.5 + Math.random() * 2;
      c.style.animationDuration = dur + 's';
      c.style.animationDelay = (Math.random() * .5) + 's';
      container.appendChild(c);
    }
    setTimeout(() => container.remove(), 5000);
  }

  // ============================================================
  //  RENDER PESERTA
  // ============================================================
  function renderPeserta() {
    const frag = document.createDocumentFragment();
    PESERTA.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'peserta-card';
      btn.dataset.id = p.id;
      btn.innerHTML = `
        <div class="avatar" style="background:${p.bg}">${p.nama[0]}</div>
        <div class="peserta-name">${p.nama}</div>
      `;
      frag.appendChild(btn);
    });
    DOM.pesertaGrid.replaceChildren(frag);
  }

  // ============================================================
  //  BANK SOAL
  // ============================================================
  async function muatBankSoal() {
    const cached = cache.get(KEY_BANK, TTL_BANK);
    if (cached?.length) { state.bank = cached; return { source: 'cache', total: cached.length }; }

    const res = await jsonp('getBankSoal');
    if (res.status !== 'ok') throw new Error(res.message || 'Server error');
    const soal = res.soal || res.bank || [];
    if (!soal.length) throw new Error('Bank soal kosong');

    state.bank = soal.map(normalizeSoal);
    cache.set(KEY_BANK, state.bank);
    return { source: 'server', total: state.bank.length };
  }

  // ============================================================
  //  MULAI
  // ============================================================
  async function mulaiKuis(peserta) {
    state.peserta = peserta;
    showLoading('Menyiapkan soal…');

    try {
      if (!state.bank.length) await muatBankSoal();
      if (state.bank.length < TOTAL_SOAL) {
        throw new Error(`Bank soal kurang dari ${TOTAL_SOAL} (saat ini ${state.bank.length})`);
      }

      state.soal = shuffle(state.bank).slice(0, TOTAL_SOAL);
      state.jawaban = new Array(TOTAL_SOAL).fill(null);
      state.idx = 0;
      state.sisa = WAKTU;
      state.mulaiAt = Date.now();
      state.submitting = false;

      const draft = cache.get(KEY_DRAFT);
      if (draft?.ids && draft.ids.join(',') === state.soal.map(s => s.id).join(',')) {
        state.jawaban = draft.jawaban;
      }

      renderSoal();
      go('scr-quiz');
      startTimer();
      toast('success', `Halo, ${peserta.nama}!`, 'Semoga sukses ya!', 3000);
    } catch (err) {
      toast('error', 'Gagal memuat soal', err.message, 6000);
      go('scr-welcome');
    } finally {
      hideLoading();
    }
  }

  // ============================================================
  //  RENDER SOAL
  // ============================================================
  function renderSoal() {
    const s = state.soal[state.idx];

    DOM.qNum.textContent = state.idx + 1;
    DOM.questionText.textContent = s.pertanyaan;
    DOM.progressFill.style.width = `${((state.idx + 1) / state.soal.length) * 100}%`;
    DOM.progressPct.textContent = Math.round(((state.idx + 1) / state.soal.length) * 100) + '%';

    DOM.questionCard.classList.remove('question-anim');
    void DOM.questionCard.offsetWidth;
    DOM.questionCard.classList.add('question-anim');

    const frag = document.createDocumentFragment();
    ['A', 'B', 'C', 'D'].forEach(letter => {
      const div = document.createElement('div');
      div.className = 'option' + (state.jawaban[state.idx] === letter ? ' selected' : '');
      div.dataset.letter = letter;
      div.setAttribute('role', 'button');
      div.setAttribute('tabindex', '0');

      const badge = document.createElement('div');
      badge.className = 'option-letter';
      badge.textContent = letter;

      const txt = document.createElement('div');
      txt.className = 'option-text';
      txt.textContent = s.opsi[letter];

      div.append(badge, txt);
      frag.appendChild(div);
    });
    DOM.options.replaceChildren(frag);

    DOM.btnPrev.disabled = state.idx === 0;
    DOM.btnNext.innerHTML = state.idx === state.soal.length - 1
      ? `Selesai <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
      : `Selanjutnya <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
  }

  function pilihJawaban(letter) {
    state.jawaban[state.idx] = letter;
    DOM.options.querySelectorAll('.option').forEach(el => {
      el.classList.toggle('selected', el.dataset.letter === letter);
    });
    cache.set(KEY_DRAFT, {
      ids: state.soal.map(s => s.id),
      jawaban: state.jawaban,
    });
  }

  async function nextSoal() {
    if (state.idx < state.soal.length - 1) {
      state.idx++;
      renderSoal();
    } else {
      const belum = state.jawaban.filter(j => j === null).length;
      const ok = await confirmModal({
        title: belum ? 'Masih ada yang kosong' : 'Selesaikan ujian?',
        msg: belum
          ? `Kamu masih punya ${belum} soal yang belum dijawab. Tetap selesaikan?`
          : 'Setelah selesai, jawaban tidak bisa diubah lagi.',
        icon: belum ? 'warn' : 'info',
        confirmText: belum ? 'Ya, selesaikan' : 'Selesai',
        cancelText: 'Cek lagi',
      });
      if (ok) selesaiKuis();
    }
  }

  function prevSoal() {
    if (state.idx > 0) { state.idx--; renderSoal(); }
  }

  // ============================================================
  //  TIMER
  // ============================================================
  function startTimer() {
    clearInterval(state.timerId);
    updateTimer();
    state.timerId = setInterval(() => {
      state.sisa--;
      updateTimer();
      if (state.sisa <= 0) {
        clearInterval(state.timerId);
        toast('warning', 'Waktu habis!', 'Jawaban dikumpulkan otomatis.', 5000);
        selesaiKuis();
      }
    }, 1000);
  }

  function updateTimer() {
    DOM.timerText.textContent = fmtTime(state.sisa);
    DOM.timerChip.classList.remove('warning', 'danger');
    if (state.sisa <= 30) DOM.timerChip.classList.add('danger');
    else if (state.sisa <= 120) DOM.timerChip.classList.add('warning');
  }

  // ============================================================
  //  SELESAI
  // ============================================================
  async function selesaiKuis() {
    if (state.submitting) return;
    state.submitting = true;
    clearInterval(state.timerId);

    const durasi = Math.min(WAKTU, Math.floor((Date.now() - state.mulaiAt) / 1000));
    const peserta = state.peserta;

    const payload = {
      nama: peserta.nama,
      sekolah: SEKOLAH,
      totalSoal: TOTAL_SOAL,
      durasi: fmtTime(durasi),
      jawaban: state.soal.map((s, i) => ({ id: s.id, jawaban: state.jawaban[i] })),
    };

    DOM.resultPeserta.textContent = `${peserta.nama} · ${SEKOLAH}`;
    DOM.finalScore.textContent = '0';
    DOM.scoreProgress.style.strokeDashoffset = 565.48;
    DOM.statBenar.textContent = '—';
    DOM.statSalah.textContent = '—';
    DOM.statWaktu.textContent = fmtTime(durasi);
    DOM.syncStatus.className = 'sync-status';
    DOM.syncStatus.textContent = 'Mengirim jawaban…';
    DOM.btnRestart.disabled = true;
    DOM.resultEmoji.textContent = '⏳';
    DOM.resultTitle.textContent = 'Menghitung…';

    go('scr-result');
    cache.del(KEY_DRAFT);

    try {
      const res = await jsonp('submit', { data: JSON.stringify(payload) });
      if (res.status !== 'ok') throw new Error(res.message || 'Server error');

      tampilkanHasil(res);
      DOM.syncStatus.className = 'sync-status ok';
      DOM.syncStatus.textContent = 'Tersimpan di server';
      toast('success', 'Nilai tersimpan!', `${peserta.nama} mendapat ${res.nilai} poin.`, 5000);

      if (res.nilai >= 60) fireConfetti(res.nilai >= 80 ? 70 : 40);
    } catch (err) {
      DOM.resultEmoji.textContent = '⚠️';
      DOM.resultTitle.textContent = 'Gagal kirim';
      DOM.syncStatus.className = 'sync-status err';
      DOM.syncStatus.textContent = 'Catat hasil manual & hubungi panitia';
      toast('error', 'Gagal kirim jawaban', err.message, 8000);
    } finally {
      DOM.btnRestart.disabled = false;
      state.submitting = false;
    }
  }

  function tampilkanHasil(res) {
    DOM.statBenar.textContent = res.benar;
    DOM.statSalah.textContent = res.salah;

    // Ring progress + warna dinamis
    const pct = res.nilai / 100;
    DOM.scoreProgress.style.strokeDashoffset = 565.48 * (1 - pct);

    // Warna ring sesuai nilai
    let ringColor = '#8B7DC4'; // lavender (default)
    if (res.nilai >= 80) ringColor = '#5FAA8B';       // mint
    else if (res.nilai >= 60) ringColor = '#5E94BC';  // sky
    else if (res.nilai < 40) ringColor = '#D96868';   // danger
    DOM.scoreProgress.style.stroke = ringColor;

    let emoji = '😊', title = 'Kerja bagus!';
    if (res.nilai >= 90) { emoji = '🏆'; title = 'Luar biasa!'; }
    else if (res.nilai >= 75) { emoji = '🎉'; title = 'Hebat!'; }
    else if (res.nilai >= 60) { emoji = '👍'; title = 'Bagus!'; }
    else if (res.nilai >= 40) { emoji = '💪'; title = 'Semangat!'; }
    else { emoji = '📚'; title = 'Perlu belajar lagi'; }
    DOM.resultEmoji.textContent = emoji;
    DOM.resultTitle.textContent = title;

    animateNumber(DOM.finalScore, 0, res.nilai, 1400);
  }

  function animateNumber(el, from, to, dur) {
    const start = performance.now();
    const step = now => {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(from + (to - from) * eased);
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ============================================================
  //  EVENTS
  // ============================================================
  function bindEvents() {
    DOM.pesertaGrid.addEventListener('click', e => {
      const card = e.target.closest('.peserta-card');
      if (!card) return;
      const peserta = PESERTA.find(p => p.id === card.dataset.id);
      if (peserta) mulaiKuis(peserta);
    });

    DOM.options.addEventListener('click', e => {
      const opt = e.target.closest('.option');
      if (opt) pilihJawaban(opt.dataset.letter);
    });

    DOM.btnNext.addEventListener('click', nextSoal);
    DOM.btnPrev.addEventListener('click', prevSoal);

    DOM.btnRestart.addEventListener('click', async () => {
      const ok = await confirmModal({
        title: 'Main lagi?',
        msg: 'Kamu akan kembali ke halaman awal. Soal akan diacak ulang.',
        icon: 'info',
        confirmText: 'Ya, main lagi',
        cancelText: 'Batal',
      });
      if (ok) {
        state.soal = [];
        state.jawaban = [];
        cache.del(KEY_DRAFT);
        go('scr-welcome');
      }
    });

    document.addEventListener('keydown', e => {
      if (!DOM.quizScreen.classList.contains('active')) return;
      if (DOM.modalBackdrop.classList.contains('active')) return;
      const k = e.key.toUpperCase();
      if (['A', 'B', 'C', 'D'].includes(k)) { e.preventDefault(); pilihJawaban(k); }
      else if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); nextSoal(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSoal(); }
    });

    window.addEventListener('beforeunload', e => {
      if (DOM.quizScreen.classList.contains('active') && !state.submitting) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  }

  // ============================================================
  //  INIT
  // ============================================================
  function init() {
    renderPeserta();
    bindEvents();

    muatBankSoal()
      .then(r => {
        if (r.source === 'server') {
          toast('info', 'Soal siap dimuat', `${r.total} soal tersedia.`, 2500);
        }
      })
      .catch(err => {
        console.warn('Prefetch gagal:', err.message);
        toast('warning', 'Gagal memuat awal', 'Akan dicoba lagi saat mulai.', 4000);
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
